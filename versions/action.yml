name: fukurou versions
description: Resolve a Minecraft version spec ("latest", "1.21.11", "1.21.6-", "1.20.5-1.21.11") to a JSON array for a job matrix.
author: morinoparty
branding:
  icon: list
  color: green

inputs:
  minecraft-version:
    description: 'Version spec: "latest", a single version such as "1.21.11", an open range such as "1.21.6-", or a closed range such as "1.20.5-1.21.11". Minecraft 1.20 or later.'
    required: false
    default: latest
  max-versions:
    description: Fail when the spec resolves to more versions than this.
    required: false
    default: "16"
  paper-channel:
    description: 'Least stable Paper build channel to accept: "stable" (only stable builds), "beta" (beta or stable) or "alpha" (any build). "latest" and ranges include only releases with an accepted build, and a single version fails without one.'
    required: false
    default: stable

outputs:
  matrix:
    description: JSON array of Minecraft versions, oldest first. Use it with fromJSON() in a matrix.
    value: ${{ steps.resolve.outputs.matrix }}

runs:
  using: composite
  steps:
    # 解決は fukurou の Kotlin の CLI（party.morino.fukurou.cli.FukurouCli）で行うので、Gradle を動かす JDK を用意する
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "21"

    - uses: gradle/actions/setup-gradle@8379f6a1328ee0e06e2bb424dadb7b159856a326 # v4.4.0

    - name: Resolve versions from the Mojang manifest and the Paper API
      id: resolve
      shell: bash
      # 入力は env 経由で渡し、run スクリプト内に直接展開しない（コマンドインジェクション対策）
      env:
        MINECRAFT_VERSION: ${{ inputs.minecraft-version }}
        MAX_VERSIONS: ${{ inputs.max-versions }}
        PAPER_CHANNEL: ${{ inputs.paper-channel }}
      run: |
        # --args は Gradle が空白で分けるので、空白や引用符を含む値はここで止める（どの入力にも正しい値には含まれない）
        for value in "$MINECRAFT_VERSION" "$MAX_VERSIONS" "$PAPER_CHANNEL"; do
          if [ -z "$value" ] || [[ "$value" =~ [[:space:]\"\'\\] ]]; then
            echo "::error::Invalid input: '$value'."
            exit 2
          fi
        done
        # このアクションは versions/ にあるため、Gradle のプロジェクトは ../kotlin。
        # wrapper のダウンロードの表示などが標準出力に混ざるので、結果は --output のファイルで受け取る
        project="$GITHUB_ACTION_PATH/../kotlin"
        output="$(mktemp)"
        "$project/gradlew" -p "$project" -q --console=plain fukurouCli \
          --args="versions $MINECRAFT_VERSION --max-versions $MAX_VERSIONS --paper-channel $PAPER_CHANNEL --output $output"
        if ! jq -e 'type == "array"' "$output" > /dev/null; then
          echo "::error::fukurou versions did not write a JSON array."
          exit 1
        fi
        matrix="$(jq -c '.' "$output")"
        echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
        echo "Minecraft versions for \`$MINECRAFT_VERSION\`: \`$matrix\`" >> "$GITHUB_STEP_SUMMARY"
