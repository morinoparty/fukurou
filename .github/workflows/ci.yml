name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Run the unit tests
        run: uv run --frozen pytest

      - name: Check that the committed JSON Schemas match the models
        run: |
          # 生成した JSON Schema がコミット済みのものとずれていないかを確かめる。
          # v1 の schema (scenario.v1.json / result.v1.json) は @v1 タグの利用者向けに残すだけで、再生成の対象ではない
          mkdir -p schema
          uv run --frozen fukurou schema scenario > schema/scenario.v2.json
          uv run --frozen fukurou schema suite > schema/suite.v1.json
          uv run --frozen fukurou schema result > schema/result.v2.json
          # 未追跡の新規ファイルも差分として検出できるよう intent-to-add にしてから比べる
          git add -N -- schema
          git diff --exit-code -- schema

  ui:
    runs-on: ubuntu-24.04
    # ビューアは GitHub Packages の @morinoparty/chlorophyll-react に依存するので、パッケージの読み取り権限が要る
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test the manifest builder
        run: python3 -m unittest ui/scripts/test_build_manifest.py

      # pnpm/action-setup はリポジトリ直下の package.json しか読まないため、
      # ui/viewer/package.json の packageManager を明示的に読ませて lockfile・ui/dist と同じ pnpm を使う
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/viewer/package.json

      # registry-url と scope を渡すと、setup-node が //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN} を
      # ユーザー単位の .npmrc（NPM_CONFIG_USERCONFIG）に書く。pnpm はリポジトリの .npmrc にある認証情報の
      # 環境変数を展開しないので、トークンはこちらから渡す
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/viewer/pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com
          scope: "@morinoparty"

      - name: Install, type-check and build the viewer
        working-directory: ui/viewer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run build

      - name: Check that the committed ui/dist is up to date
        # ui/dist はアクションから直接使うためコミットしている。ビルド結果と一致しなければ失敗させる
        run: |
          # ハッシュ付きの新しいアセットのような未追跡ファイルも検出する
          git add -N -- ui/dist
          git diff --exit-code -- ui/dist

  kotlin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # JitPack と同じ Java 21 でビルドする（ライブラリは toolchain を使わず Java 21 のバイトコードを出す）
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8379f6a1328ee0e06e2bb424dadb7b159856a326 # v4.4.0

      - name: Build and test the Kotlin library
        # リポジトリ直下は Python のプロジェクトなので、Gradle の wrapper は kotlin/ にある。
        # 単体テストだけを実行する（Minecraft を起動する e2eTest は check に含まれない）
        working-directory: kotlin
        run: ./gradlew check

      - name: Upload the golden result files
        # ResultSchemaTest が書く result.json の見本。pydantic のモデルとの突き合わせに使う
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kotlin-contract
          path: kotlin/build/contract/*.json
          if-no-files-found: ignore

  kotlin-contract:
    # Kotlin の ResultSchemaTest が書いた result.json の見本を、Python 版の pydantic モデルで読み直す（§8.4）。
    # 検証に通るだけでなく、モデルが書き出すキーを Kotlin 側が 1 つも落としていないことも確かめる
    needs: kotlin
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - uses: actions/download-artifact@v8
        with:
          name: kotlin-contract
          path: contract

      - name: Validate the Kotlin golden files with the pydantic models
        run: |
          uv run --frozen python - contract <<'PY'
          import json, pathlib, sys
          from fukurou.result.model import ResultV2

          def diff(expected, actual, path="$"):
              # dict と list を再帰でたどり、モデルが書き出すキーの集合と見本のキーの集合の差を集める
              problems = []
              if isinstance(expected, dict) and isinstance(actual, dict):
                  if set(expected) != set(actual):
                      missing = sorted(set(expected) - set(actual))
                      extra = sorted(set(actual) - set(expected))
                      problems.append(f"{path}: missing={missing} extra={extra}")
                  for key in set(expected) & set(actual):
                      problems += diff(expected[key], actual[key], f"{path}.{key}")
              elif isinstance(expected, list) and isinstance(actual, list):
                  for index, (e, a) in enumerate(zip(expected, actual)):
                      problems += diff(e, a, f"{path}[{index}]")
              return problems

          files = sorted(pathlib.Path(sys.argv[1]).glob("*.json"))
          # 見本が 1 つも無いのは kotlin ジョブの異常なので、黙って通さない
          assert files, "no golden files were downloaded"
          failed = False
          for file in files:
              text = file.read_text()
              model = ResultV2.model_validate_json(text)
              problems = diff(model.model_dump(mode="json", by_alias=True), json.loads(text))
              print(f"{file.name}: {'ok' if not problems else 'key mismatch'}")
              for problem in problems:
                  print(f"  {problem}")
              failed |= bool(problems)
          sys.exit(1 if failed else 0)
          PY

  kotlin-e2e:
    # 本物の Paper と Minecraft クライアントで Kotlin 版の e2eTest（SmokeTest）を実行する（§8.4）
    name: Kotlin e2e (Minecraft ${{ fromJSON(needs.versions.outputs.smoke)[0] }})
    needs: versions
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # 最新の stable（versions ジョブが Mojang と Paper の API から解決したもの）
      MINECRAFT_VERSION: ${{ fromJSON(needs.versions.outputs.smoke)[0] }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Xvfb・xdotool・ソフトウェア描画の apt パッケージと、ツール・アセットのキャッシュ。
      # FUKUROU_WORK_DIR と LIBGL_ALWAYS_SOFTWARE を GITHUB_ENV に入れ、Gradle のテスト JVM がそれを引き継ぐ
      - uses: ./setup
        id: setup
        with:
          minecraft-version: ${{ env.MINECRAFT_VERSION }}

      # サーバーは既定でテストを動かす JVM の java で起動するので、新しい Minecraft が求める Java 25 にする
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8379f6a1328ee0e06e2bb424dadb7b159856a326 # v4.4.0

      - name: Run the Kotlin e2e tests
        working-directory: kotlin
        # -Pfukurou.* は build.gradle.kts がすべて -D としてテストの JVM に渡す
        run: |
          ./gradlew e2eTest \
            -Pfukurou.acceptEula=true \
            -Pfukurou.minecraftVersion="$MINECRAFT_VERSION" \
            -Pfukurou.outDir="$RUNNER_TEMP/kotlin-out" \
            -Pfukurou.missingHost=fail

      - name: Check result.json
        # SmokeTest の 2 件がすべて passed で記録されていること（result.json は JVM の終了時に書かれる）
        run: |
          python3 - "$RUNNER_TEMP/kotlin-out" <<'PY'
          import json, pathlib, sys
          results = sorted(pathlib.Path(sys.argv[1]).glob("*/result.json"))
          assert len(results) == 1, results
          result = json.loads(results[0].read_text())
          print(results[0], result["status"], result["summary"])
          assert result["fukurou"]["runner"] == "kotlin", result["fukurou"]
          assert result["status"] == "passed", result["status"]
          assert result["summary"]["total"] == 2, result["summary"]
          assert result["summary"]["passed"] == 2, result["summary"]
          assert all(test["status"] == "passed" for test in result["tests"]), [t["status"] for t in result["tests"]]
          PY

      - name: Upload the Kotlin e2e output
        # fukurou-paper-* の名前にすると ui-smoke の download（Python 版の smoke の run 数を数える）に混ざるので、別の名前にする
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fukurou-kotlin-e2e-${{ env.MINECRAFT_VERSION }}
          path: |
            ${{ runner.temp }}/kotlin-out
            kotlin/build/test-results/e2eTest
            kotlin/build/reports/tests/e2eTest
          if-no-files-found: warn

  versions:
    runs-on: ubuntu-24.04
    outputs:
      all: ${{ steps.all.outputs.matrix }}
      smoke: ${{ steps.smoke.outputs.matrix }}
      smoke-include: ${{ steps.smoke-matrix.outputs.include }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 範囲指定の解決が動くことだけを確かめる（実際のゲーム起動は latest のみで行う）
      - uses: ./versions
        id: all
        with:
          minecraft-version: 1.21.6-

      - uses: ./versions
        id: smoke
        with:
          minecraft-version: latest

      # Paper がまだ alpha の最新版（新しいクライアントの描画方式の変化などを早めに検出する）
      - uses: ./versions
        id: smoke-alpha
        with:
          minecraft-version: latest
          paper-channel: alpha

      # 最新の stable と最新の alpha を、チャンネル付きの matrix にまとめる（同じバージョンなら 1 つにする）
      - name: Build the smoke matrix
        id: smoke-matrix
        env:
          STABLE: ${{ steps.smoke.outputs.matrix }}
          ALPHA: ${{ steps.smoke-alpha.outputs.matrix }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          stable, alpha = json.loads(os.environ["STABLE"]), json.loads(os.environ["ALPHA"])
          include = [{"minecraft-version": v, "paper-channel": "stable"} for v in stable]
          include += [{"minecraft-version": v, "paper-channel": "alpha"} for v in alpha if v not in stable]
          print("include=" + json.dumps(include))
          PY

      - name: Check the resolved matrices
        env:
          ALL: ${{ steps.all.outputs.matrix }}
          SMOKE: ${{ steps.smoke.outputs.matrix }}
        run: |
          python3 -c '
          import json, sys
          all_versions, smoke = json.loads(sys.argv[1]), json.loads(sys.argv[2])
          assert isinstance(all_versions, list) and all_versions, all_versions
          assert isinstance(smoke, list) and len(smoke) == 1, smoke
          ' "$ALL" "$SMOKE"

  smoke:
    name: Smoke test (Minecraft ${{ matrix.minecraft-version }}, ${{ matrix.paper-channel }})
    needs: versions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.versions.outputs.smoke-include) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # プラグイン無しの素の Paper で、examples/fukurou.yml の小さなスイート（2 テスト）が
      # サーバー起動・参加・fixture・スクリーンショットまで通ることを確かめる
      - uses: ./
        id: fukurou
        with:
          accept-eula: "true"
          minecraft-version: ${{ matrix.minecraft-version }}
          paper-channel: ${{ matrix.paper-channel }}
          suite: examples/fukurou.yml
          plugins: ""

      - name: Check the outputs
        if: always()
        env:
          RESULT: ${{ steps.fukurou.outputs.result }}
          RESULT_FILE: ${{ steps.fukurou.outputs.result-file }}
          ARTIFACT_NAME: ${{ steps.fukurou.outputs.artifact-name }}
          TESTS_SUMMARY: ${{ steps.fukurou.outputs.tests-summary }}
          FAILED_TESTS: ${{ steps.fukurou.outputs.failed-tests }}
        run: |
          echo "result=$RESULT artifact=$ARTIFACT_NAME tests-summary=$TESTS_SUMMARY failed-tests=$FAILED_TESTS"
          test -f "$RESULT_FILE"
          test "$RESULT" = "passed"
          test -z "$FAILED_TESTS"
          python3 -c '
          import json, sys
          summary = json.loads(sys.argv[1])
          assert summary["total"] == 2, summary
          assert summary["passed"] == 2, summary
          ' "$TESTS_SUMMARY"

  ui-smoke:
    needs: [versions, smoke]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # smoke の成果物からサイトを組み立てられることだけを確かめる（アップロードはしない）
      - uses: ./ui
        id: site
        with:
          upload: "false"

      - name: Check the generated site
        env:
          SITE_DIR: ${{ steps.site.outputs.site-dir }}
          TESTS_SUMMARY: ${{ steps.site.outputs.tests-summary }}
          SMOKE_INCLUDE: ${{ needs.versions.outputs.smoke-include }}
        run: |
          test -f "$SITE_DIR/index.html"
          test -f "$SITE_DIR/manifest.json"
          # smoke は最新の stable と最新の alpha（同じなら 1 つ）。バージョンが 1 つのときは download-artifact が
          # 平置きにした artifact を、build_manifest.py が 1 つの run として読めていることも確かめることになる。
          # どの run にも result が埋め込まれ、各 run の 2 テストが数えられていること
          python3 -c '
          import json, os, sys
          runs = len(json.loads(os.environ["SMOKE_INCLUDE"]))
          manifest = json.load(open(sys.argv[1]))
          print(manifest["summary"])
          assert manifest["summary"]["runs"]["total"] == runs, manifest["summary"]
          assert manifest["summary"]["tests"]["total"] == 2 * runs, manifest["summary"]
          assert all(run["result"] is not None for run in manifest["runs"]), manifest["warnings"]
          summary = json.loads(os.environ["TESTS_SUMMARY"])
          assert summary["total"] == 2 * runs, summary
          ' "$SITE_DIR/manifest.json"
