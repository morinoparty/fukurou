name: fukurou
description: Run a suite of in-game tests against one Minecraft (Paper) version in one server session, with real vanilla clients, and upload screenshots, logs and result.json.
author: morinoparty
branding:
  icon: camera
  color: green

inputs:
  accept-eula:
    description: 'Set to "true" to accept the Minecraft EULA (https://aka.ms/MinecraftEULA). The server and clients do not start without it.'
    required: true
  minecraft-version:
    description: 'A single Minecraft version, such as "1.21.11". Use morinoparty/fukurou/versions to expand ranges into a matrix.'
    required: true
  suite:
    description: Path to a suite file (fukurou.yml), relative to the workspace. Its scenarios globs, players and fixtures are shared by every test.
    required: false
    default: ""
  scenarios:
    description: Glob patterns of scenario files to run, relative to the workspace, separated by newlines or commas.
    required: false
    default: ""
  scenario:
    description: Inline scenario (JSON or YAML), run as the test "inline". Combine freely with the other selection inputs.
    required: false
    default: ""
  scenario-file:
    description: Path to a scenario file (JSON or YAML), relative to the workspace. Multiple lines run one test each.
    required: false
    default: ""
  tests:
    description: Only run tests whose id matches one of these ids or glob patterns, separated by newlines or commas. Empty runs every selected test.
    required: false
    default: ""
  tags:
    description: Only run tests that have one of these tags, separated by newlines or commas. Combined with "tests", a test must match both.
    required: false
    default: ""
  isolation:
    description: 'Force "reset" or "fresh-server" isolation for every test, overriding what each test and the suite declare. Empty keeps each test''s own isolation.'
    required: false
    default: ""
  fail-fast:
    description: Set to "true" to stop the suite at the first failed or errored test, skipping the rest.
    required: false
    default: "false"
  plugins-dir:
    description: Directory that contains the plugin jars under test.
    required: false
    default: ${{ github.workspace }}
  plugins:
    description: Glob patterns for plugin jars inside plugins-dir, separated by newlines or commas. An empty string installs no plugins.
    required: false
    default: "*.jar"
  dependencies:
    description: 'YAML list of extra plugins to download: {url, sha256?} or {github: owner/repo, tag, asset}.'
    required: false
    default: ""
  server-properties:
    description: Extra server.properties lines ("key=value", one per line).
    required: false
    default: ""
  server-files:
    description: Directory whose contents are copied into the server directory before it starts (for example plugins/<Name>/config.yml).
    required: false
    default: ""
  server-build:
    description: Paper build number. Defaults to the newest build accepted by paper-channel. An explicit build is used even when its channel is less stable (with a warning).
    required: false
    default: ""
  paper-channel:
    description: 'Least stable Paper build channel to accept: "stable" (only stable builds), "beta" (beta or stable) or "alpha" (any build). The newest accepted build is used, and the run fails when the version has none.'
    required: false
    default: stable
  java-version:
    description: 'Java major version for the server, or "auto" to pick max(the version Mojang requires, the version the plugins are compiled for).'
    required: false
    default: auto
  work-dir:
    description: Working directory for the server, clients and caches. Defaults to "$RUNNER_TEMP/fukurou-work".
    required: false
    default: ""
  out-dir:
    description: Output directory for result.json, screenshots and logs. Defaults to "$RUNNER_TEMP/fukurou-out".
    required: false
    default: ""
  upload-artifact:
    description: Set to "true" to upload out-dir as an artifact (also when the run fails).
    required: false
    default: "true"
  artifact-name:
    description: Artifact name. Defaults to "fukurou-paper-<minecraft-version>".
    required: false
    default: ""
  retention-days:
    description: Retention days of the uploaded artifact.
    required: false
    default: "14"
  github-token:
    description: Token for the GitHub API, used to download "github:" dependencies (avoids the unauthenticated rate limit and allows private repositories).
    required: false
    default: ${{ github.token }}
  skip-system-deps:
    description: Set to "true" to skip installing Xvfb, xdotool and the OpenGL/OpenAL libraries with apt-get.
    required: false
    default: "false"

outputs:
  result:
    description: '"passed", "failed" or "error", read from result.json''s run status ("error" when it is missing).'
    value: ${{ steps.outputs.outputs.result }}
  tests-summary:
    description: 'Test counts as JSON, read from result.json''s summary, for example {"total":3,"passed":2,"failed":1,"error":0,"skipped":0}. Empty object when result.json is missing.'
    value: ${{ steps.outputs.outputs.tests-summary }}
  failed-tests:
    description: Comma-separated ids of the tests whose status is "failed" or "error".
    value: ${{ steps.outputs.outputs.failed-tests }}
  result-file:
    description: Path to result.json.
    value: ${{ steps.outputs.outputs.result-file }}
  artifact-name:
    description: Name of the uploaded artifact.
    value: ${{ steps.prepare.outputs.artifact-name }}
  out-dir:
    description: Output directory.
    value: ${{ steps.prepare.outputs.out-dir }}

runs:
  using: composite
  steps:
    # 入力は必ず env 経由で渡し、run スクリプト内に ${{ }} を直接展開しない（コマンドインジェクション対策）
    - name: Check inputs
      id: prepare
      shell: bash
      env:
        ACCEPT_EULA: ${{ inputs.accept-eula }}
        MINECRAFT_VERSION: ${{ inputs.minecraft-version }}
        SUITE: ${{ inputs.suite }}
        SCENARIOS: ${{ inputs.scenarios }}
        SCENARIO: ${{ inputs.scenario }}
        SCENARIO_FILE: ${{ inputs.scenario-file }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        WORK_DIR: ${{ inputs.work-dir }}
        OUT_DIR: ${{ inputs.out-dir }}
      run: |
        # 起動前に分かる入力の誤りはここで止め、重いセットアップを走らせない
        if [ "$ACCEPT_EULA" != "true" ]; then
          echo "::error::fukurou starts a Minecraft server and clients, which requires accepting the Minecraft EULA (https://aka.ms/MinecraftEULA). Set accept-eula: true to accept it."
          exit 2
        fi
        if [ -z "$MINECRAFT_VERSION" ]; then
          echo "::error::minecraft-version is required."
          exit 2
        fi
        # suite / scenarios / scenario-file / scenario はどれも組み合わせられる。1 つも無ければ選択が空になる
        if [ -z "$SUITE" ] && [ -z "$SCENARIOS" ] && [ -z "$SCENARIO_FILE" ] && [ -z "$SCENARIO" ]; then
          echo "::error::Set at least one of suite, scenarios, scenario-file and scenario."
          exit 2
        fi
        # 入力の既定値から別の入力を参照できないため、成果物名はここで決める
        if [ -z "$ARTIFACT_NAME" ]; then
          ARTIFACT_NAME="fukurou-paper-$MINECRAFT_VERSION"
        fi
        # 入力の既定値でのコンテキストの展開に頼らず、ランナーの一時ディレクトリをここで既定値にする
        WORK_DIR="${WORK_DIR:-$RUNNER_TEMP/fukurou-work}"
        OUT_DIR="${OUT_DIR:-$RUNNER_TEMP/fukurou-out}"
        {
          echo "artifact-name=$ARTIFACT_NAME"
          echo "work-dir=$WORK_DIR"
          echo "out-dir=$OUT_DIR"
        } >> "$GITHUB_OUTPUT"

    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # 既定では利用者のリポジトリを見て uv の版とキャッシュキーを決めてしまうため、fukurou 自身を基準にする
      with:
        version: "0.12.18"
        working-directory: ${{ github.action_path }}
        cache-dependency-glob: uv.lock
        cache-suffix: fukurou
        ignore-empty-workdir: "true"

    # 選択引数のタイポ（存在しないスイート、0 件になるフィルタなど）を、apt もサーバーのダウンロードも
    # 始める前に見つける。fukurou list は選択が不正または 0 件なら exit 2 になる
    - name: Validate the suite
      shell: bash
      env:
        SUITE: ${{ inputs.suite }}
        SCENARIOS: ${{ inputs.scenarios }}
        SCENARIO: ${{ inputs.scenario }}
        SCENARIO_FILE: ${{ inputs.scenario-file }}
        TESTS: ${{ inputs.tests }}
        TAGS: ${{ inputs.tags }}
        ISOLATION: ${{ inputs.isolation }}
      run: |
        args=(list)
        [ -n "$SUITE" ] && args+=(--suite "$SUITE")
        [ -n "$SCENARIOS" ] && args+=(--scenarios="$SCENARIOS")
        [ -n "$SCENARIO_FILE" ] && args+=(--scenario-file="$SCENARIO_FILE")
        [ -n "$SCENARIO" ] && args+=(--scenario="$SCENARIO")
        [ -n "$TESTS" ] && args+=(--test="$TESTS")
        [ -n "$TAGS" ] && args+=(--tag="$TAGS")
        [ -n "$ISOLATION" ] && args+=(--isolation "$ISOLATION")
        selected="$(uv run --frozen --no-dev --project "$GITHUB_ACTION_PATH" fukurou "${args[@]}")"
        echo "Selected tests: $selected"

    - name: Install the virtual display and client dependencies
      if: inputs.skip-system-deps != 'true'
      shell: bash
      run: |
        # GPU の無いランナーで Mesa のソフトウェアレンダリングを使うための描画・音声ライブラリも入れる。
        # 26.3 以降のクライアント（renderpearl）は Xvfb で OpenGL のウィンドウを作れないことがあるため、
        # ソフトウェア実装の Vulkan（lavapipe）も入れて Vulkan バックエンドで描画できるようにする
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y \
          xvfb xdotool \
          libgl1 libgl1-mesa-dri libglx-mesa0 libegl1 libopenal1 \
          libvulkan1 mesa-vulkan-drivers \
          libxrandr2 libxinerama1 libxcursor1 libxi6

    - name: Determine the Java version for the server
      id: java
      shell: bash
      env:
        JAVA_VERSION_INPUT: ${{ inputs.java-version }}
        MINECRAFT_VERSION: ${{ inputs.minecraft-version }}
        PLUGINS_DIR: ${{ inputs.plugins-dir }}
        PLUGINS: ${{ inputs.plugins }}
      run: |
        # auto のときは Mojang の要求とプラグインのクラスファイルの版から決める（Java 自体は不要）
        if [ "$JAVA_VERSION_INPUT" = "auto" ]; then
          version="$(uv run --frozen --no-dev --project "$GITHUB_ACTION_PATH" fukurou java \
            --minecraft-version "$MINECRAFT_VERSION" \
            --plugins-dir "$PLUGINS_DIR" \
            --plugins="$PLUGINS")"
        else
          version="$JAVA_VERSION_INPUT"
        fi
        echo "Java for the server: $version"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: ${{ steps.java.outputs.version }}

    # PortableMC 本体と Mojang のアセット・ランタイムは大きいので、バージョンごとにキャッシュする
    - uses: actions/cache@v5
      with:
        path: |
          ${{ steps.prepare.outputs.work-dir }}/tools
          ${{ steps.prepare.outputs.work-dir }}/cache
        key: fukurou-portablemc-5.0.4-${{ runner.os }}-${{ inputs.minecraft-version }}
        # アセットはバージョン間で共有されるため、別バージョンのキャッシュからでも復元する
        restore-keys: |
          fukurou-portablemc-5.0.4-${{ runner.os }}-

    - name: Run the tests
      id: run
      # 失敗しても成果物のアップロードと outputs の設定を続け、最後のステップで失敗させる
      continue-on-error: true
      shell: bash
      env:
        # GPU の無いランナーで Mesa のソフトウェアレンダリングを使う
        LIBGL_ALWAYS_SOFTWARE: "true"
        # github: 形式の依存プラグインを GitHub API から取得するときに使う
        GITHUB_TOKEN: ${{ inputs.github-token }}
        MINECRAFT_VERSION: ${{ inputs.minecraft-version }}
        SUITE: ${{ inputs.suite }}
        SCENARIOS: ${{ inputs.scenarios }}
        SCENARIO: ${{ inputs.scenario }}
        SCENARIO_FILE: ${{ inputs.scenario-file }}
        TESTS: ${{ inputs.tests }}
        TAGS: ${{ inputs.tags }}
        ISOLATION: ${{ inputs.isolation }}
        FAIL_FAST: ${{ inputs.fail-fast }}
        PLUGINS_DIR: ${{ inputs.plugins-dir }}
        PLUGINS: ${{ inputs.plugins }}
        DEPENDENCIES: ${{ inputs.dependencies }}
        SERVER_PROPERTIES: ${{ inputs.server-properties }}
        SERVER_FILES: ${{ inputs.server-files }}
        SERVER_BUILD: ${{ inputs.server-build }}
        PAPER_CHANNEL: ${{ inputs.paper-channel }}
        WORK_DIR: ${{ steps.prepare.outputs.work-dir }}
        OUT_DIR: ${{ steps.prepare.outputs.out-dir }}
      run: |
        # 複数行の入力も壊れないよう、引数は配列に積んでそのまま渡す
        # 値が "-" で始まってもオプションと誤認されないよう、自由記述の値は --name=value の形で渡す
        args=(
          run
          --accept-eula
          --minecraft-version "$MINECRAFT_VERSION"
          --plugins-dir "$PLUGINS_DIR"
          --plugins="$PLUGINS"
          --java "$JAVA_HOME/bin/java"
          --work-dir "$WORK_DIR"
          --out-dir "$OUT_DIR"
          --paper-channel "$PAPER_CHANNEL"
        )
        if [ -n "$SUITE" ]; then
          args+=(--suite "$SUITE")
        fi
        if [ -n "$SCENARIOS" ]; then
          args+=(--scenarios="$SCENARIOS")
        fi
        if [ -n "$SCENARIO_FILE" ]; then
          args+=(--scenario-file="$SCENARIO_FILE")
        fi
        if [ -n "$SCENARIO" ]; then
          args+=(--scenario="$SCENARIO")
        fi
        if [ -n "$TESTS" ]; then
          args+=(--test="$TESTS")
        fi
        if [ -n "$TAGS" ]; then
          args+=(--tag="$TAGS")
        fi
        if [ -n "$ISOLATION" ]; then
          args+=(--isolation "$ISOLATION")
        fi
        if [ "$FAIL_FAST" = "true" ]; then
          args+=(--fail-fast)
        fi
        if [ -n "$DEPENDENCIES" ]; then
          args+=(--dependencies="$DEPENDENCIES")
        fi
        if [ -n "$SERVER_PROPERTIES" ]; then
          args+=(--server-properties="$SERVER_PROPERTIES")
        fi
        if [ -n "$SERVER_FILES" ]; then
          args+=(--server-files "$SERVER_FILES")
        fi
        if [ -n "$SERVER_BUILD" ]; then
          args+=(--server-build "$SERVER_BUILD")
        fi
        uv run --frozen --no-dev --project "$GITHUB_ACTION_PATH" fukurou "${args[@]}"

    # サーバーやクライアントの本体・アセットは out-dir に含まれないため、そのままアップロードしてよい
    - name: Upload screenshots, logs and result.json
      # 途中のセットアップが失敗しても、書けた分の結果は残す
      if: always() && steps.prepare.outcome == 'success' && inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.prepare.outputs.artifact-name }}
        path: ${{ steps.prepare.outputs.out-dir }}
        if-no-files-found: warn
        retention-days: ${{ inputs.retention-days }}
        overwrite: true

    - name: Set outputs
      id: outputs
      if: always() && steps.prepare.outcome == 'success'
      shell: bash
      env:
        RESULT_FILE: ${{ steps.prepare.outputs.out-dir }}/result.json
      run: |
        # result.json が無い（引数の解析前に失敗した等）場合も error 扱いにし、outputs とステップサマリーの表をまとめて書く
        python3 - "$RESULT_FILE" <<'PY'
        import json
        import os
        import sys

        result_file = sys.argv[1]
        try:
            with open(result_file, encoding="utf-8") as file:
                result = json.load(file)
        except (OSError, ValueError):
            result = {}

        status = result.get("status")
        if status not in ("passed", "failed", "error"):
            status = "error"
        tests = result.get("tests", [])
        summary = result.get("summary") or {}
        failed_ids = [test["id"] for test in tests if test.get("status") in ("failed", "error")]

        print(f"fukurou result: {status}")
        github_output = os.environ.get("GITHUB_OUTPUT")
        if github_output:
            with open(github_output, "a", encoding="utf-8") as file:
                file.write(f"result={status}\n")
                file.write(f"tests-summary={json.dumps(summary, separators=(',', ':'))}\n")
                file.write(f"failed-tests={','.join(failed_ids)}\n")
                file.write(f"result-file={result_file}\n")

        def cell(text):
            # Markdown の表が壊れないよう、改行とパイプを潰す
            return str(text).replace("\r", " ").replace("\n", " ").replace("|", "\\|")

        def duration(test):
            ms = test.get("durationMs")
            return f"{ms / 1000:.1f}s" if isinstance(ms, (int, float)) else "–"

        def failure_of(test):
            failure = test.get("failure")
            if isinstance(failure, dict) and failure.get("message"):
                return f"{failure['message']} ({failure.get('phase')})"
            reset = test.get("reset")
            if isinstance(reset, dict) and reset.get("error"):
                return reset["error"]
            return test.get("skipReason") or ""

        github_step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
        if github_step_summary:
            lines = [f"### fukurou: Minecraft {result.get('minecraft', {}).get('version', '?')}", ""]
            run_failure = result.get("failure")
            if isinstance(run_failure, dict):
                lines.append(f"⚠️ **{run_failure.get('phase')}**: {cell(run_failure.get('message'))}")
                lines.append("")
            counts = ", ".join(
                f"{summary.get(key, 0)} {key}" for key in ("passed", "failed", "error", "skipped") if summary.get(key)
            )
            lines.append(f"{summary.get('total', 0)} tests: {counts}" if counts else f"{summary.get('total', 0)} tests")
            lines.append("")
            if tests:
                lines.append("| Test | Status | Duration | Failure |")
                lines.append("| --- | --- | --- | --- |")
                for test in tests:
                    lines.append(
                        f"| {cell(test.get('id'))} | {cell(test.get('status'))} | {duration(test)} | {cell(failure_of(test))} |"
                    )
                lines.append("")
            with open(github_step_summary, "a", encoding="utf-8") as file:
                file.write("\n".join(lines) + "\n")
        PY

    - name: Fail if the tests did not pass
      if: always() && steps.prepare.outcome == 'success' && steps.run.outcome != 'success'
      shell: bash
      env:
        RESULT: ${{ steps.outputs.outputs.result }}
      run: |
        echo "::error::fukurou run did not pass (result: $RESULT)."
        exit 1
