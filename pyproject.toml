[project]
name = "hukurou"
version = "0.1.0"
description = "In-game test runner for Minecraft plugins: drive real clients from JSON scenarios"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11",
    "pyyaml>=6.0",
]

[project.scripts]
hukurou = "hukurou.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hukurou"]

[tool.pytest.ini_options]
testpaths = ["tests"]
