[project]
name = "fukurou"
version = "2.2.0"
description = "In-game test runner for Minecraft plugins: run a suite of tests against real clients in one server session"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11",
    "pyyaml>=6.0",
]

[project.scripts]
fukurou = "fukurou.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fukurou"]

[tool.pytest.ini_options]
testpaths = ["tests"]
