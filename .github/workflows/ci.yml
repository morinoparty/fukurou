name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-24.04
    # ビューアは GitHub Packages の @morinoparty/chlorophyll-react に依存するので、パッケージの読み取り権限が要る
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test the manifest builder
        run: python3 -m unittest ui/scripts/test_build_manifest.py

      # ルートのアクションが outputs とステップの要約を書くスクリプト（jq はランナーに入っている）
      - name: Test the result summarizer
        run: python3 -m unittest scripts/test_summarize_results.py

      # pnpm/action-setup はリポジトリ直下の package.json しか読まないため、
      # ui/viewer/package.json の packageManager を明示的に読ませて lockfile・ui/dist と同じ pnpm を使う
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/viewer/package.json

      # registry-url と scope を渡すと、setup-node が //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN} を
      # ユーザー単位の .npmrc（NPM_CONFIG_USERCONFIG）に書く。pnpm はリポジトリの .npmrc にある認証情報の
      # 環境変数を展開しないので、トークンはこちらから渡す
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/viewer/pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com
          scope: "@morinoparty"

      - name: Install, type-check and build the viewer
        working-directory: ui/viewer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run build

      - name: Check that the committed ui/dist is up to date
        # ui/dist はアクションから直接使うためコミットしている。ビルド結果と一致しなければ失敗させる
        run: |
          # ハッシュ付きの新しいアセットのような未追跡ファイルも検出する
          git add -N -- ui/dist
          git diff --exit-code -- ui/dist

  kotlin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # JitPack と同じ Java 21 でビルドする（ライブラリは toolchain を使わず Java 21 のバイトコードを出す）
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8379f6a1328ee0e06e2bb424dadb7b159856a326 # v4.4.0

      - name: Build and test the Kotlin library
        # Gradle の wrapper は kotlin/ にある。単体テスト（エージェントのサブプロジェクトと、
        # result.json を schema/result.v2.json で検証する ResultSchemaTest を含む）だけを実行する。
        # Minecraft を起動する e2eTest と agentTest は check に含まれない
        working-directory: kotlin
        run: ./gradlew check

  agent:
    # 本物の Paper（クライアントなし）でサーバー内エージェントの状態の取得・イベント・execute を確かめる。
    # サーバーの Java は fukurou が選ぶ（足りなければ Temurin をダウンロードする）ので、ここでは Java 21 だけを用意する
    name: Agent tests (Minecraft ${{ fromJSON(needs.versions.outputs.smoke)[0] }})
    needs: versions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # 最新の stable（versions ジョブが Mojang と Paper の API から解決したもの）
      MINECRAFT_VERSION: ${{ fromJSON(needs.versions.outputs.smoke)[0] }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8379f6a1328ee0e06e2bb424dadb7b159856a326 # v4.4.0

      # Paper の jar とサーバー用の JDK はキャッシュに置く
      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/fukurou-work/cache
          key: fukurou-v3-agent-${{ runner.os }}-${{ env.MINECRAFT_VERSION }}
          restore-keys: |
            fukurou-v3-agent-${{ runner.os }}-

      - name: Run the agent tests
        working-directory: kotlin
        # -Pfukurou.* は build.gradle.kts がすべて -D としてテストの JVM に渡す
        run: |
          ./gradlew agentTest \
            -Pfukurou.acceptEula=true \
            -Pfukurou.minecraftVersion="$MINECRAFT_VERSION" \
            -Pfukurou.workDir="$RUNNER_TEMP/fukurou-work" \
            -Pfukurou.outDir="$RUNNER_TEMP/agent-out"

      - name: Upload the agent test output
        # fukurou-paper-* の名前にすると ui-smoke のサイトに混ざるので、別の名前にする
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fukurou-agent-${{ env.MINECRAFT_VERSION }}
          path: |
            ${{ runner.temp }}/agent-out
            kotlin/build/test-results/agentTest
            kotlin/build/reports/tests/agentTest
          if-no-files-found: warn

  versions:
    runs-on: ubuntu-24.04
    outputs:
      all: ${{ steps.all.outputs.matrix }}
      smoke: ${{ steps.smoke.outputs.matrix }}
      smoke-include: ${{ steps.smoke-matrix.outputs.include }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 範囲指定の解決が動くことだけを確かめる（実際のゲーム起動は latest のみで行う）
      - uses: ./versions
        id: all
        with:
          minecraft-version: 1.21.6-

      - uses: ./versions
        id: smoke
        with:
          minecraft-version: latest

      # Paper がまだ alpha の最新版（新しいクライアントの描画方式の変化などを早めに検出する）
      - uses: ./versions
        id: smoke-alpha
        with:
          minecraft-version: latest
          paper-channel: alpha

      # 最新の stable と最新の alpha を、チャンネル付きの matrix にまとめる（同じバージョンなら 1 つにする）
      - name: Build the smoke matrix
        id: smoke-matrix
        env:
          STABLE: ${{ steps.smoke.outputs.matrix }}
          ALPHA: ${{ steps.smoke-alpha.outputs.matrix }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          stable, alpha = json.loads(os.environ["STABLE"]), json.loads(os.environ["ALPHA"])
          include = [{"minecraft-version": v, "paper-channel": "stable"} for v in stable]
          include += [{"minecraft-version": v, "paper-channel": "alpha"} for v in alpha if v not in stable]
          print("include=" + json.dumps(include))
          PY

      - name: Check the resolved matrices
        env:
          ALL: ${{ steps.all.outputs.matrix }}
          SMOKE: ${{ steps.smoke.outputs.matrix }}
        run: |
          python3 -c '
          import json, sys
          all_versions, smoke = json.loads(sys.argv[1]), json.loads(sys.argv[2])
          assert isinstance(all_versions, list) and all_versions, all_versions
          assert isinstance(smoke, list) and len(smoke) == 1, smoke
          ' "$ALL" "$SMOKE"

  e2e:
    # 本物の Paper と Minecraft クライアントで e2eTest（SmokeTest、2 台同時の MultiServerTest、
    # エージェント経由の状態・イベント・execute と入力を組み合わせる V3Test）を、
    # 利用者と同じルートのアクション（uses: ./）で実行する。最新の stable と最新の alpha（同じなら 1 つ）
    name: e2e (Minecraft ${{ matrix.minecraft-version }}, ${{ matrix.paper-channel }})
    needs: versions
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.versions.outputs.smoke-include) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 成果物は fukurou-paper-<version> の名前で、GameServerExtension ごとの run（<run id>/result.json）を束ねて上げる
      - uses: ./
        id: fukurou
        with:
          accept-eula: "true"
          minecraft-version: ${{ matrix.minecraft-version }}
          paper-channel: ${{ matrix.paper-channel }}
          working-directory: kotlin
          gradle-task: e2eTest
          # 宣言したホストのプラグインが無いことを見逃さない
          gradle-args: -Pfukurou.missingHost=fail

      - name: Check the outputs
        if: always()
        env:
          RESULT: ${{ steps.fukurou.outputs.result }}
          RESULT_FILE: ${{ steps.fukurou.outputs.result-file }}
          OUT_DIR: ${{ steps.fukurou.outputs.out-dir }}
          ARTIFACT_NAME: ${{ steps.fukurou.outputs.artifact-name }}
          TESTS_SUMMARY: ${{ steps.fukurou.outputs.tests-summary }}
          FAILED_TESTS: ${{ steps.fukurou.outputs.failed-tests }}
        run: |
          echo "result=$RESULT artifact=$ARTIFACT_NAME tests-summary=$TESTS_SUMMARY failed-tests=$FAILED_TESTS"
          test -n "$RESULT_FILE"
          test -f "$RESULT_FILE"
          test "$RESULT" = "passed"
          test -z "$FAILED_TESTS"
          # テストが 1 件以上あり、すべて passed として数えられていること
          jq -e '.total > 0 and .passed == .total' <<< "$TESTS_SUMMARY"
          # どの run も Kotlin の実行系が書いたもの
          for file in "$OUT_DIR"/*/result.json; do
            jq -e '.fukurou.runner == "kotlin" and .status == "passed"' "$file"
          done

      - name: Upload the JUnit reports
        # fukurou-paper-* の名前にすると ui-smoke のサイトに混ざるので、別の名前にする
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fukurou-e2e-reports-${{ matrix.minecraft-version }}
          path: |
            kotlin/build/test-results/e2eTest
            kotlin/build/reports/tests/e2eTest
          if-no-files-found: warn

  ui-smoke:
    needs: [versions, e2e]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 期待する件数を数えるため、ui アクションに任せず自分でダウンロードしてから渡す。
      # 一致が 1 件だけだと、入れ子の束の run ディレクトリが直下に展開される
      - uses: actions/download-artifact@v8
        with:
          pattern: fukurou-paper-*
          merge-multiple: false
          path: ${{ runner.temp }}/fukurou-artifacts

      # e2e の成果物からサイトを組み立てられることだけを確かめる（アップロードはしない）
      - uses: ./ui
        id: site
        with:
          upload: "false"
          artifacts-dir: ${{ runner.temp }}/fukurou-artifacts

      - name: Check the generated site
        env:
          SITE_DIR: ${{ steps.site.outputs.site-dir }}
          TESTS_SUMMARY: ${{ steps.site.outputs.tests-summary }}
          SMOKE_INCLUDE: ${{ needs.versions.outputs.smoke-include }}
          ARTIFACTS_DIR: ${{ runner.temp }}/fukurou-artifacts
        run: |
          test -f "$SITE_DIR/index.html"
          test -f "$SITE_DIR/manifest.json"
          # e2e の artifact は 1 バージョンにつき複数の run（GameServerExtension ごと）を束ねた入れ子になっている。
          # ダウンロードした result.json をすべて数え、サイトの run 数とテスト数がそれと一致することを確かめる
          python3 - "$SITE_DIR/manifest.json" "$ARTIFACTS_DIR" <<'PY'
          import json, os, pathlib, sys
          manifest = json.load(open(sys.argv[1]))
          results = [json.loads(p.read_text()) for p in sorted(pathlib.Path(sys.argv[2]).rglob("result.json"))]
          versions = len(json.loads(os.environ["SMOKE_INCLUDE"]))
          expected_tests = sum(result["summary"]["total"] for result in results)
          print(manifest["summary"], f"results={len(results)} tests={expected_tests}")
          # 少なくともバージョンごとに 1 つの run があり、どの run にも result が埋め込まれていること
          assert manifest["summary"]["runs"]["total"] >= versions, manifest["summary"]
          assert manifest["summary"]["runs"]["total"] == len(results), (manifest["summary"], len(results))
          assert all(run["result"] is not None for run in manifest["runs"]), manifest["warnings"]
          assert expected_tests > 0, results
          assert manifest["summary"]["tests"]["total"] == expected_tests, manifest["summary"]
          summary = json.loads(os.environ["TESTS_SUMMARY"])
          assert summary["total"] == expected_tests, summary
          PY
