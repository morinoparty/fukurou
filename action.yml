name: fukurou
description: Run your Kotlin (JUnit) fukurou tests against one Minecraft (Paper) version with real vanilla clients, and upload screenshots, logs and result.json.
author: morinoparty
branding:
  icon: camera
  color: green

inputs:
  accept-eula:
    description: 'Set to "true" to accept the Minecraft EULA (https://aka.ms/MinecraftEULA). The server and clients do not start without it.'
    required: true
  minecraft-version:
    description: 'A single Minecraft version, such as "1.21.11". Use morinoparty/fukurou/versions to expand ranges into a matrix.'
    required: true
  paper-channel:
    description: 'Least stable Paper build channel to accept: "stable" (only stable builds), "beta" (beta or stable) or "alpha" (any build). The newest accepted build is used, and the run fails when the version has none.'
    required: false
    default: stable
  paper-build:
    description: Paper build number. Defaults to the newest build accepted by paper-channel. An explicit build is used even when its channel is less stable (with a warning).
    required: false
    default: ""
  working-directory:
    description: Directory of the Gradle build that contains the fukurou tests (where ./gradlew is), relative to the workspace.
    required: false
    default: "."
  gradle-task:
    description: Gradle task(s) that run the fukurou tests, separated by spaces.
    required: false
    default: gameTest
  gradle-args:
    description: Extra Gradle arguments, separated by spaces or newlines (for example "-Pfukurou.missingHost=fail --info"). Quoting is not supported.
    required: false
    default: ""
  java-version:
    description: Java version that runs Gradle and the tests. The Minecraft server's Java is picked (and downloaded if needed) by fukurou itself.
    required: false
    default: "21"
  work-dir:
    description: Working directory for the server, clients and caches. Defaults to "$RUNNER_TEMP/fukurou-work".
    required: false
    default: ""
  out-dir:
    description: Output directory for result.json, screenshots and logs (one subdirectory per server run). Defaults to "$RUNNER_TEMP/fukurou-out".
    required: false
    default: ""
  upload-artifact:
    description: Set to "true" to upload out-dir as an artifact (also when the tests fail).
    required: false
    default: "true"
  artifact-name:
    description: Artifact name. Defaults to "fukurou-paper-<minecraft-version>".
    required: false
    default: ""
  retention-days:
    description: Retention days of the uploaded artifact.
    required: false
    default: "14"
  github-token:
    description: Token for the GitHub API, passed to the tests as GITHUB_TOKEN (used to download plugins from GitHub releases without the unauthenticated rate limit).
    required: false
    default: ${{ github.token }}
  skip-system-deps:
    description: Set to "true" to skip installing Xvfb, xdotool, jq and the OpenGL/OpenAL libraries with apt-get.
    required: false
    default: "false"

outputs:
  result:
    description: '"passed", "failed" or "error", aggregated over every <out-dir>/*/result.json ("error" when there is none or any run errored).'
    value: ${{ steps.outputs.outputs.result }}
  tests-summary:
    description: 'Test counts summed over every run as JSON, for example {"total":3,"passed":2,"failed":1,"error":0,"skipped":0}.'
    value: ${{ steps.outputs.outputs.tests-summary }}
  failed-tests:
    description: 'Comma-separated "<run label or id>/<test id>" of the tests whose status is "failed" or "error".'
    value: ${{ steps.outputs.outputs.failed-tests }}
  result-file:
    description: Path to the first result.json (empty when there is none).
    value: ${{ steps.outputs.outputs.result-file }}
  artifact-name:
    description: Name of the uploaded artifact.
    value: ${{ steps.prepare.outputs.artifact-name }}
  out-dir:
    description: Output directory.
    value: ${{ steps.prepare.outputs.out-dir }}

runs:
  using: composite
  steps:
    # 入力は必ず env 経由で渡し、run スクリプト内に ${{ }} を直接展開しない（コマンドインジェクション対策）
    - name: Check inputs
      id: prepare
      shell: bash
      env:
        ACCEPT_EULA: ${{ inputs.accept-eula }}
        MINECRAFT_VERSION: ${{ inputs.minecraft-version }}
        JAVA_VERSION_INPUT: ${{ inputs.java-version }}
        GRADLE_TASK: ${{ inputs.gradle-task }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        WORK_DIR: ${{ inputs.work-dir }}
        OUT_DIR: ${{ inputs.out-dir }}
      run: |
        # 起動前に分かる入力の誤りはここで止め、重いセットアップを走らせない
        if [ "$ACCEPT_EULA" != "true" ]; then
          echo "::error::fukurou starts a Minecraft server and clients, which requires accepting the Minecraft EULA (https://aka.ms/MinecraftEULA). Set accept-eula: true to accept it."
          exit 2
        fi
        if [ -z "$MINECRAFT_VERSION" ]; then
          echo "::error::minecraft-version is required."
          exit 2
        fi
        if [ -z "${GRADLE_TASK//[[:space:]]/}" ]; then
          echo "::error::gradle-task is required."
          exit 2
        fi
        # v2 の java-version はサーバーの Java（auto）だった。v3 では Gradle を動かす JDK で、サーバーの Java は fukurou が選ぶ
        if [ "$JAVA_VERSION_INPUT" = "auto" ]; then
          echo "::error::java-version is now the JDK that runs Gradle (default 21). fukurou picks the server's Java by itself, so remove java-version: auto."
          exit 2
        fi
        # 入力の既定値から別の入力を参照できないため、成果物名はここで決める
        if [ -z "$ARTIFACT_NAME" ]; then
          ARTIFACT_NAME="fukurou-paper-$MINECRAFT_VERSION"
        fi
        # 入力の既定値でのコンテキストの展開に頼らず、ランナーの一時ディレクトリをここで既定値にする
        WORK_DIR="${WORK_DIR:-$RUNNER_TEMP/fukurou-work}"
        OUT_DIR="${OUT_DIR:-$RUNNER_TEMP/fukurou-out}"
        # テストの JVM は working-directory で動くので、相対パスはワークスペースからの絶対パスにしておく
        case "$WORK_DIR" in /*) ;; *) WORK_DIR="$GITHUB_WORKSPACE/$WORK_DIR" ;; esac
        case "$OUT_DIR" in /*) ;; *) OUT_DIR="$GITHUB_WORKSPACE/$OUT_DIR" ;; esac
        {
          echo "artifact-name=$ARTIFACT_NAME"
          echo "work-dir=$WORK_DIR"
          echo "out-dir=$OUT_DIR"
        } >> "$GITHUB_OUTPUT"

    - name: Install the virtual display and client dependencies
      if: inputs.skip-system-deps != 'true'
      shell: bash
      # パッケージの一覧は setup/action.yml と共有するスクリプトにまとめてある
      run: bash "$GITHUB_ACTION_PATH/scripts/install-system-deps.sh"

    # PortableMC 本体と Mojang のアセット・ランタイム、サーバー用の JDK は大きいので、バージョンごとにキャッシュする
    - uses: actions/cache@v5
      with:
        path: |
          ${{ steps.prepare.outputs.work-dir }}/tools
          ${{ steps.prepare.outputs.work-dir }}/cache
        key: fukurou-v3-portablemc-5.0.4-${{ runner.os }}-${{ inputs.minecraft-version }}
        # アセットはバージョン間で共有されるため、別バージョンのキャッシュからでも復元する
        restore-keys: |
          fukurou-v3-portablemc-5.0.4-${{ runner.os }}-

    # Gradle とテストの JVM を動かす JDK。サーバーの Java は fukurou が Mojang の要求とプラグインから決める
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - uses: gradle/actions/setup-gradle@8379f6a1328ee0e06e2bb424dadb7b159856a326 # v4.4.0

    - name: Run the tests
      id: run
      # 失敗しても成果物のアップロードと outputs の設定を続け、最後のステップで失敗させる
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        # GPU の無いランナーで Mesa のソフトウェアレンダリングを使う
        LIBGL_ALWAYS_SOFTWARE: "true"
        # GitHub のリリースからプラグインを取得するときに使う
        GITHUB_TOKEN: ${{ inputs.github-token }}
        # 設定は FukurouConfig が読む FUKUROU_* 環境変数で渡す（利用者のビルドスクリプトに -P の転送を書かせない）
        FUKUROU_ACCEPT_EULA: "true"
        FUKUROU_MINECRAFT_VERSION: ${{ inputs.minecraft-version }}
        FUKUROU_PAPER_CHANNEL: ${{ inputs.paper-channel }}
        FUKUROU_WORK_DIR: ${{ steps.prepare.outputs.work-dir }}
        FUKUROU_OUT_DIR: ${{ steps.prepare.outputs.out-dir }}
        PAPER_BUILD: ${{ inputs.paper-build }}
        GRADLE_TASK: ${{ inputs.gradle-task }}
        GRADLE_ARGS: ${{ inputs.gradle-args }}
      run: |
        # paper-build は指定されたときだけ渡し、ジョブの env にある FUKUROU_PAPER_BUILD を空で潰さない
        if [ -n "$PAPER_BUILD" ]; then
          export FUKUROU_PAPER_BUILD="$PAPER_BUILD"
        fi
        if [ ! -f ./gradlew ]; then
          echo "::error::No Gradle wrapper (gradlew) in working-directory $PWD."
          exit 2
        fi
        # タスクと引数は空白・改行で分ける。eval はせず、グロブの展開も止めてから単語に分割する
        set -f
        # shellcheck disable=SC2206
        tasks=($GRADLE_TASK)
        # shellcheck disable=SC2206
        args=($GRADLE_ARGS)
        set +f
        bash ./gradlew --console=plain "${tasks[@]}" "${args[@]}"

    # サーバーやクライアントの本体・アセットは out-dir に含まれないため、そのままアップロードしてよい。
    # out-dir には GameServerExtension ごとの run ディレクトリ（<run id>/result.json）が並ぶ
    - name: Upload screenshots, logs and result.json
      # 途中のセットアップが失敗しても、書けた分の結果は残す
      if: always() && steps.prepare.outcome == 'success' && inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.prepare.outputs.artifact-name }}
        path: ${{ steps.prepare.outputs.out-dir }}
        if-no-files-found: warn
        retention-days: ${{ inputs.retention-days }}
        overwrite: true

    - name: Set outputs
      id: outputs
      if: always() && steps.prepare.outcome == 'success'
      shell: bash
      env:
        OUT_DIR: ${{ steps.prepare.outputs.out-dir }}
        MINECRAFT_VERSION: ${{ inputs.minecraft-version }}
      run: bash "$GITHUB_ACTION_PATH/scripts/summarize-results.sh"

    # Gradle が成功しても fukurou の run が passed とは限らない（キャッシュから復元された・fukurou のテストを
    # 選ばなかった・結果を別の場所に書いた）。集計した result も見て、passed 以外なら失敗にする
    - name: Fail if the tests did not pass
      if: always() && steps.prepare.outcome == 'success' && (steps.run.outcome != 'success' || steps.outputs.outputs.result != 'passed')
      shell: bash
      env:
        RUN_OUTCOME: ${{ steps.run.outcome }}
        RESULT: ${{ steps.outputs.outputs.result }}
      run: |
        if [ "$RUN_OUTCOME" = "success" ]; then
          echo "::error::Gradle succeeded, but the fukurou runs did not pass (result: ${RESULT:-unknown}). Check that the task runs the fukurou tests, is not restored from the build cache, and writes to out-dir."
        else
          echo "::error::fukurou tests did not pass (Gradle: $RUN_OUTCOME, result: ${RESULT:-unknown})."
        fi
        exit 1
